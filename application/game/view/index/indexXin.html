    <script type="text/javascript">
      window.onload=function(){
        var wid=$(window).width()/414;
             $('#view').attr('content','initial-scale='+wid+',maximum-scale=1,user-scalable=no');
        }
            $(function(){
                $(".game4").click(function(){
                  $('#createfrom').attr('action', '{:url('Douniuplaywjy/roomcreate')}');
                  $('.typetitle').html('<img src="__STATIC__/game/room/6_ren.png">');
                  $('.cons').css('background-image','url(__STATIC__/game/room/bg.png)');
                 $(".overlay,.setact").show();
               })
                $(".game2").click(function(){
                  $('#createfrom').attr('action', '{:url('Douniuplay12r/roomcreate')}');
                  $('.typetitle').html('<img src="__STATIC__/game/room/12_ren.png">');
                  $('.cons').css('background-image','url(__STATIC__/game/room/bg2.png)');
                 $(".overlay,.setact").show();
               })
                $(".baijiale").click(function(){
                    $("#bjlcr").show();
                })
               $(".setact>img").click(function(){
                 $(".setact").add(".overlay").hide();
                  })
               $('#createfrom').ajaxsubmit({success:function(ret){
                      window.location.href=ret.url;
                }});
                $('#bjlCreateRoom').ajaxsubmit({success:function(ret){
                      window.location.href=ret.url;
                }});
              }) 

              $('#myCarousel').hammer().on('swipeleft', function(){
                  $(this).carousel('next');
                 });
             $('#myCarousel').hammer().on('swiperight', function(){
                  $(this).carousel('prev');
                 });
            $('#myCarousel').carousel({
              interval:2000
            })
            $(".pay_list_c1").on("click",function(){
              $(this).addClass("on").siblings().removeClass("on");
              if($('#select20').attr('class')=="pay_list_c1 on"){
                  $('.ren').html('80个/人');
                }
              if($('#select10').attr('class')=="pay_list_c1 on"){
                  $('.ren').html('40个/人');
                }
            })
            $(".danxuanyangzi").on("click",function(){
              var name=$(this).attr('name');
              $('[name='+name+']').removeClass('on');
              $(this).addClass("on");
              if($('#bjl20').attr('class')=="danxuanyangzi on"){
                  $('.bjlren').html('80个/人');
                }
              if($('#bjl10').attr('class')=="danxuanyangzi on"){
                  $('.bjlren').html('40个/人');
                }
            })
            $(".piaochecked").on("click",function(){
                  $(this).toggleClass( "on_check" );
            })                
    </script>
