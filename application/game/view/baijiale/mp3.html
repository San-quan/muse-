<script>
    function mp3play(id){
        
        document.getElementById(id).play();
    }
    function mp3pause(id){
        document.getElementById(id).pause();
    }

    function mp3playandpause(id){
        mp3play(id);
        mp3pause(id);
    }

</script>
<script>
    function audioAutoPlay(id){
        var audio = document.getElementById(id),
                play = function(){
                    audio.play();
                };
        document.addEventListener("WeixinJSBridgeReady", function () {
            play();
            mp3pause(id);
        }, false);
        document.addEventListener('YixinJSBridgeReady', function() {
            play();
            mp3pause(id);
        }, false);
    }

    audioAutoPlay('addscore');
    audioAutoPlay('click');
    audioAutoPlay('enddraw');
    audioAutoPlay('endlost');
    audioAutoPlay('endwin');
    audioAutoPlay('gamestart');
    audioAutoPlay('openalert');
    audioAutoPlay('sendcard');
    
    audioAutoPlay('background');

    audioAutoPlay('mp3daojishi');
   

window.onload=function(){

},1000)
}




</script>
