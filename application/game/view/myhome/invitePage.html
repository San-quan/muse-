    <style type="text/css">
        *{margin:0;padding:0;list-style: none;}
        body{background: url(__STATIC__/game/img/union_bg.jpg) no-repeat;background-size:100% 100%;}
        .bigone{position: absolute;top: 15%;left:10% ;width: 80%;height: 60%;overflow: hidden;box-shadow:  0 0 10px #FF6363,inset 0 0 3px #FF6363; }
        .kai{width: 22%;position: absolute;top: 60%;left: 39%;z-index: 4;}
        .tou{width: 18%;border: 2px solid #B495D8;border-radius: 50%;position: absolute;top: 20%;left: 50%;margin-left: -9%;}
        .name,.name1{text-align: center;line-height: 2rem;position: absolute;top: 32%;left: 20%;width: 60%;color: #FCC95B;}
        .name1{color: #333;font-size: 1rem;}
        .name1 span{margin-right: 0.2rem;}
        .content{position: absolute;top: 45%;left: 10%;width: 80%;}
        .content ul{height: 8rem;overflow-y: scroll;margin-top: 0.3rem;}
        .title{border-bottom: 2px solid #efefef;color: #ccc;padding-left:1rem;padding-bottom: 0.4rem;}
        .content .tou1{width: 14%;border-radius: 0.3rem;float: left;margin: 0.5rem 1rem 0;vertical-align: middle;}
        .content li p{height: 2rem;}
        .content li p:last-child{color: #ccc;}
        .content span.name2{float: left;display: inline-block;margin-top: 0.3rem;}
        .content span.cardnum{float: right;margin-right: 0.6rem;display: inline-block;margin-top: 0.3rem;}


        /* entire container, keeps perspective */
        .flip-container {
            perspective: 1000;
        }
            /* flip the pane when hovered */
            .flip-container:hover .flipper, .flip-container.hover .flipper {
                transform: rotateY(180deg);
            }

        /*.flip-container, .front, .back {
            width: 320px;
            height: 480px;
        }*/

        /* flip speed goes here */
        .flipper {
            transition: 0.6s;
            transform-style: preserve-3d;

            position: relative;
        }

        /* hide back of pane during swap */
        .front, .back {
            backface-visibility: hidden;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* front pane, placed above back */
        .front {
            z-index: 2;
        }

        /* back, initially hidden pane */
        .back {
            transform: rotateY(180deg);
        }
        .xinfeng{
            position: absolute;
            top: 49%;
            left: 8%;
            width: 84%;
            overflow: hidden;
            z-index: 3;
        }
    </style>
</head>
<body>

    <div class="before">
        <img src="__STATIC__/game/img/union_card.jpg" class="bigone">
        <img src="__STATIC__/game/img/union_card_bottom.png" class="xinfeng">
        <div class="flip-container kai" ontouchstart="this.classList.toggle('hover');">
            <div class="flipper choose" onclick="shengqing()">
                <div class="front">
                    <!-- 前面内容 -->
                    <img class="isagree" src="__STATIC__/game/img/union_join.png" style="width: 100%;">
                </div>
                <div class="back">
                    <!-- 背面内容 -->
                    <img class="isagree" src="__STATIC__/game/img/union_join.png" style="width: 100%;">
                </div>
            </div>
        </div>
        <img src="{$result.photo}" class="tou">
        <p class="name"><span>{$result.nickname}</span><br/><b>邀请您加入游戏</b></p>
    </div>

    <!-- <form callback="none1" id="formopen" action="{:url('applyJoinGroup')}" method="post"> -->
        <input type="hidden" class="aid" value="{$result.id}">

    <!-- </form> -->

<div class="showtip" style="position:fixed; display:none; background:rgba(0,0,0,0.5); z-index:9000; top:0; bottom:0; left:0; right:0;"><div  style="position:absolute; top:40%; text-align:center; width:100%;"><span class="msgbox" style="border:1px solid #ffffff;box-shadow: 0px 2px 5px #000;padding:15px 40px; background:#FFFFFF; border-radius:4px;"></span></div></div>



    <script type="text/javascript" src="__STATIC__/game/js/jquery-1.12.1.js"></script>
<script src="__STATIC__/js/setajax.js"></script>
    <script type="text/javascript">
        $(function(){
            // $('#formopen').ajaxsubmit({success:function(ret){
            //     //领取成功回调方法，如果要做成功后的动作，可以在这里写
            //     $('#isagree').attr('src','__STATIC__/game/img/union_finish.png');
            //     $('.choose').removeClass('flipper');
            //     ret=eval(ret);
            //     ret.result_message
            // }});
           
        })
        function shengqing(){
             var aid=$('.aid').val();
             $.post('{:url('applyJoinGroup')}',{aid:aid},function(ret){
                 ret = eval(ret); 
                 if (ret.restult!=1) {
                     $(".msgbox").css('color','green');
                     $(".isagree").attr('src','__STATIC__/game/img/union_finish.png');
                     $('.choose').removeClass('flipper');
                     $('.choose').removeAttr('onclick');
                 }else{
                     $(".msgbox").css('color','red');
                 }
                 $(".msgbox").html(ret.result_message);
                 $(".showtip").show();
                 setTimeout(function(){
                     $(".showtip").hide();
                 },1000);
             },'json');

         }
    </script>
