           {volist name="result.userlist" id="vo"}
           {if condition="$vo.account_code neq $memberinfo.id"} 
           <li  class="{$vo.account_code}">
               <img style="height:3.5rem;float:left;margin-left:1rem;margin-top: 0.75rem;border-radius:0.5rem;" src="{$vo.headimgurl}">

               {if condition="$vo.status eq 2"}

                   <span onclick="canJoin(3,{$vo.account_code})" class="{$vo.account_code}" name="kick" style="width:3rem;height:1.5rem;color: white;background:#D9534F;float:right;margin-top: 1.85rem;line-height: 1.5rem;text-align: center;margin-right: 0.5rem;border-radius:0.2rem;">踢出</span>
               {else/}
                    <span onclick="canJoin(2,{$vo.account_code})" class="{$vo.account_code}" name="refuse" style="width:3rem;height:1.5rem;color: white;background:#D9534F;float:right;margin-top: 1.85rem;line-height: 1.5rem;text-align: center;margin-right: 0.5rem;border-radius:0.2rem;">拒绝</span>

    <div class="tishi" style="position:fixed; display:none; background:rgba(0,0,0,0.5); z-index:9000; top:0; bottom:0; left:0; right:0;"><div  style="position:absolute; top:40%; text-align:center; width:100%;"><span class="msgbox" style="border:1px solid #ffffff;box-shadow: 0px 2px 5px #000;padding:15px 40px; background:#FFFFFF; border-radius:4px;">是否消耗100张房卡开启管理功能</span></div></div>

<script src="__STATIC__/game/js/jquery-1.12.1.js" type="text/javascript"></script>
<script type="text/javascript">
    function type(type){
        $('.gametype').hide();
        $('li[name='+type+']').show();
        $('.gamekind img').css('opacity','0.5');
        $(".r"+type).css('opacity','1');
    }
    function tishi(data){

    }
    function canJoin(status,uid){
        $.post('{:url('dealMemberApply')}',{type:status,uid:uid},function(ret){
            switch(status){
                case 1:
                    $('.'+uid+'[name="agree"]').remove();
                    $('.'+uid+'[name="refuse"]').html('踢出');
                    $('.'+uid+'[name="refuse"]').attr({'name':'kick','onclick':'canJoin(3,'+uid+')'});
                    break;
                case 2:
                    $('.'+uid).remove();
                    break;
                case 3:
                    $('.'+uid).remove();
                    break;
            }
        });
    }
    function kaiqiguanli(){
        $.post('{:url('openManagerFunc')}',{},function(ret){
             ret = eval(ret); 
            if (ret.restult!=2) {
                $('.guanli').show();
                $(".msgbox").css('color','green');
                $('.guanlibut').attr('src','__STATIC__/game/img/rc_group_open.png');
            }else if(ret.restult==3){
                var cardsnum=$('cardsNum').html();
                cardsnum-=100;
                $('cardsNum').html(cardsnum);
                $('.guanli').show();
                $(".msgbox").css('color','green');
                $('.guanlibut').attr('src','__STATIC__/game/img/rc_group_open.png');

            }else{
                $(".msgbox").css('color','red');
            }
            $(".msgbox").html(ret.dec);
            $(".showtip").show();
            setTimeout(function(){
                $(".showtip").hide();
            },1000);
        },'json');
    }
</script>
