<script src="__STATIC__/laydate/laydate.js"></script> <!-- 改成你的路径 -->
<script>


//执行一个laydate实例
laydate.render({
  elem: '#startDate', //指定元素
  type: 'datetime'
});
laydate.render({
  elem: '#endDate', //指定元素
  type: 'datetime'
});
var roomDetail=function(pwd){
  $.post("getRoomDetail",{pwd:pwd},function(res){
    if(res.state==0){
      $('#modal').modal('show');
      $('#modelContent').html("<p style='color:red;'>暂无数据！</p>");
    }else if(res.state==1){
      $('#modelContent').html(res.html);
      $('#modal').modal('show');
    }
  },'JSON')
}
var add=function(){
  var uid=$("#UID").val(); 
  $.post("{:url('Sp/add')}",{uid:uid},function(res){
    if(res.state==0){
      $('#modal').modal('show');
      $('#modelContent').html("<p style='color:red;'>ID不能为空！</p>");
    }else if(res.state==1){
      $('#modelContent').html("<p style='color:red;'>请输入正确的ID！</p>");
      $('#modal').modal('show');
    }else if(res.state==2){
      window.location.reload();
    }else if(res.state==3){
      $('#modelContent').html("<p style='color:red;'>该ID已被添加</p>");
      $('#modal').modal('show');
    }
  },'JSON')
}
var deleteSP=function(uid){
  // var uid=$("#UID").val(); 
  $.post("{:url('Sp/deleteSP')}",{uid:uid},function(res){
    if(res.state==0){
      $('#modal').modal('show');
      $('#modelContent').html("<p style='color:red;'>ID不能为空！</p>");
    }else if(res.state==1){
      $('#modelContent').html("<p style='color:red;'>请输入正确的ID！</p>");
      $('#modal').modal('show');
    }else if(res.state==2){
      window.location.reload();
    }else if(res.state==3){
      $('#modelContent').html("<p style='color:red;'>该ID已被添加</p>");
      $('#modal').modal('show');
    }
  },'JSON')
}
var editSP=function(uid){
  $.ajax({
    type:"post",
    dataType:"json",
    url:"{:url('Sp/editData')}",
    data:{
      uid:uid,
    },
    success:function(data){
      var modal_title="编辑控制";
      var modal_body='<table class="table table-striped b-t text-small">'+
                  '<tr>'+
                    '<td align="center"><b>玩家ID</b><td>'+
                    '<td align="center"><b>昵称</b><td>'+
                    '<td align="center"><b>概率（%）</b><td>'+
                  '</tr>'+
                  '<tr>'+
                    '<td align="center">'+data.uid+'<td>'+
                    '<td align="center">'+data.nickname+'<td>'+
                    '<td align="center"><input type="number" value="'+data.rank+'" id="rank" class="input-small inline form-control" /><td>'+
                  '</tr>'+
                  '</table>';
      var modal_footer='<button type="button" class="btn btn-small btn-default" onclick="doEditSP('+data.uid+')">保存</button>'+
                      '<button type="button" class="btn btn-small btn-default" data-dismiss="modal" aria-hidden="true">取消</button>';
      $("#modal .modal-title").html(modal_title);
      $("#modelContent").html(modal_body);
      $("#modal .modal-footer").html(modal_footer);
      $("#modal").modal("show");
    }
  })
}
var doEditSP=function(uid){
  var rank=$("#rank").val();
  rank=parseInt(rank);
  if(isNaN(rank)||rank<0||rank>100){
    var modal_title="提示";
    var modal_body="概率请输入0到100之间的正整数";
    var modal_footer='<button type="button" class="btn btn-small btn-default" data-dismiss="modal" aria-hidden="true">确定</button>';
    $("#modal .modal-title").html(modal_title);
    $("#modelContent").html(modal_body);
    $("#modal .modal-footer").html(modal_footer);
  }else{
    $.ajax({
      type:"post",
      dataType:"json",
      url:"{:url('Sp/doEditSP')}",
      data:{
        uid:uid,
        rank:rank
      },
      success:function(data){
        var modal_title="提示";
        var modal_body=data.desc;
        var modal_footer='<button type="button" class="btn btn-small btn-default" data-dismiss="modal" aria-hidden="true" onclick="dumpToSelf()">确定</button>';
        $("#modal .modal-title").html(modal_title);
        $("#modelContent").html(modal_body);
        $("#modal .modal-footer").html(modal_footer);
      }
    })
  }
}
var dumpToSelf=function(){
  window.location.reload();
}
</script>
