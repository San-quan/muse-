<body>
  <!-- header -->
  <header id="header" class="navbar bg bg-black">

    <a class="navbar-brand" href="#">运营后台</a>
  </header>
  <!-- / header -->
  <section id="content">
    <div class="main padder">
      <div class="row">
        <div class="col-lg-4 col-offset-4 m-t-large">
          <section class="panel">
            <header class="panel-heading text-center">
              申请代理
            </header>
            <!-- <form action="{:url('login/login')}" class="padder" > -->
              <div class="block">
                <label class="control-label">用户名:</label>
                <input type="text" placeholder="请输入用户名" id="username" name="username" class="form-control">
              </div>
              <div class="block">
                <label class="control-label">真实姓名:</label>
                <input type="text" placeholder="请输入姓名" id="realname" name="realname" class="form-control">
              </div>
              <div class="block">
                <label class="control-label">密码:</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" class="form-control">
              </div>
              <div class="block">
                <label class="control-label">确认密码:</label>
                <input type="password" id="repeatPassword" name="repeatPassword" placeholder="请确认密码" class="form-control">
              </div>
              <div class="block">
                <label class="control-label">手机号:</label>
                <input type="text" id="phone" name="phone" placeholder="请输入手机号" class="form-control">
              </div>
              <div class="block">
                <label class="control-label">邀请码:</label>
                <input type="text" id="invite" name="invite" placeholder="请输入邀请码" class="form-control">
              </div>
              <div class="block">
                <label class="control-label">玩家ID:</label>
                <input type="text" id="uid" name="uid" placeholder="请输入玩家ID" class="form-control">
              </div>
              <div class="block">
                <label class="control-label">微信号:</label>
                <input type="text" id="wxid" name="wxid" placeholder="请输入微信号" class="form-control">
              </div>
              <!-- <div class="checkbox">
                <label>
                  <input type="checkbox"> Agree the <a href="#">terms and policy</a>
                </label>
              </div> -->
              <button type="button" class="btn  btn-block btn-info" onclick="signup()">申请</button>
              <div class="line line-dashed"></div>
              <!-- <div class="row">
                <div class="col-sm-6 text-center">
                   <a href="#" class="btn btn-facebook btn-circle btn-small"><i class="icon-facebook"></i>Sign up with Facebook</a>
                </div>
                <div class="col-sm-6 text-center">
                  <a href="#" class="btn btn-twitter btn-circle btn-small"><i class="icon-twitter"></i>Sign up with Twitter</a>
                </div>
              </div> -->
              <div class="line line-dashed"></div>
              <p class="text-muted text-center"><small>已经拥有账号</small></p>
              <a href="{:url('login/index')}" class="btn btn-white btn-block">登陆</a>
            <!-- </form> -->
          </section>
        </div>
      </div>
    </div>
  </section>
  <!-- .modal -->
  <div id="modal" class="modal fade">
    <form class="m-b-none">
      <div class="modal-dialog pos-abt" style="margin-top:-235px; top:50%">
        <div class="modal-content">
          <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal" aria-hidden="true"><i class="icon-remove"></i></button>
            <h4 class="modal-title" id="myModalLabel">提示</h4>
          </div>
          <div class="modal-body">          
            <div class="block" id="applyResult" style="text-align: center;">
              申请成功
            </div>
          
         
          </div>
          <div class="modal-footer" style="text-align: center" id="sureApply"> 
            <button type="button" class="btn btn-small btn-primary" data-dismiss="modal" aria-hidden="true" >确定</button>
          </div>
        </div><!-- /.modal-content -->
      </div>
    </form>
  </div>
  <!-- / .modal -->
  <script>
    var signup=function(){
      var username=$('#username').val();
      var password=$('#password').val();
      var repeatPassword=$('#repeatPassword').val();
      var phone=$("#phone").val();
      var invite=$("#invite").val();
      var realname=$("#realname").val();
      var uid=$("#uid").val();
      var wxid=$("#wxid").val();
      if(username==''){
        $('#modal').modal('show');
        $("#applyResult").html("用户名不能为空");
        return; 
      }else if(password==''){
        $('#modal').modal('show');
        $("#applyResult").html("密码不能为空");
        return; 
      }else if(repeatPassword==''){
        $('#modal').modal('show');
        $("#applyResult").html("确认密码不能为空");
        return; 
      }else if(phone==''){
        $('#modal').modal('show');
        $("#applyResult").html("手机号不能为空");
        return; 
      }else if(invite==''){
        $('#modal').modal('show');
        $("#applyResult").html("邀请码不能为空");
        return; 
      }else if(password.length<6){
        $('#modal').modal('show');
        $("#applyResult").html("密码不能小于6位");
        return; 
      }else if(CheckChinese(username)){
        $('#modal').modal('show');
        $("#applyResult").html("用户名不能含有汉字");
        return;
      }else if(password!=repeatPassword){
        $('#modal').modal('show');
        $("#applyResult").html("两次输入密码不一致");
        return;
      }else if(phone.length!=11){
        $('#modal').modal('show');
        $("#applyResult").html("请输入正确的手机号");
        return;
      }else if(realname==''){
        $('#modal').modal('show');
        $("#applyResult").html("真实姓名不能为空");
        return;
      }else if(uid!=''&&isNaN(uid)){
        $('#modal').modal('show');
        $("#applyResult").html("请输入正确的用户ID");
        return;
      }else{
        $.post("{:url('Signup/applyAgent')}",{username:username,password:password,repeatPassword:repeatPassword,phone:phone,invite:invite,realname:realname,uid:uid,wxid:wxid},function(res){
            // var res=eval('('+rel+')');
            $('#modal').modal('show');
            if(res.state!=1){
              $("#sureApply").html('<button type="button" class="btn btn-small btn-primary" data-dismiss="modal" aria-hidden="true" >确定</button>');
            }else{
              $("#sureApply").html('<button onclick="goToIndex()" type="button" class="btn btn-small btn-primary" data-dismiss="modal" aria-hidden="true">确定</button>');
            }
            $("#applyResult").html(res.desc);
        },'json');
      }
      
    
    } 
    function goToIndex(){
       window.location.href="{:url('Login/index')}";
    }
    function CheckChinese(val){     
　　var reg = new RegExp("[\\u4E00-\\u9FFF]+","g");
  　　if(reg.test(val)){     
         // alert("不能输入汉字！");  
         return true;      
  　　}else{
        return false;
      }
    }

  </script>
