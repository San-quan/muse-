<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>登陆</title>
  <meta name="description" content="mobile first, app, web app, responsive, admin dashboard, flat, flat ui">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"> 
  <link rel="stylesheet" href="__STATIC__/admin/css/bootstrap.css">
  <link rel="stylesheet" href="__STATIC__/admin/css/font-awesome.min.css">
  <link rel="stylesheet" href="__STATIC__/admin/css/style.css">
  <!--[if lt IE 9]>
    <script src="__STATIC__/admin/js/ie/respond.min.js"></script>
    <script src="__STATIC__/admin/js/ie/html5.js"></script>
  <![endif]-->
</head>
<script src="__STATIC__/admin/js/jquery.min.js"></script>
  <!-- Bootstrap -->
  <script src="__STATIC__/admin/js/bootstrap.js"></script>
  <!-- app -->
  <script src="__STATIC__/admin/js/app.js"></script>
  <script src="__STATIC__/admin/js/app.plugin.js"></script>
  <script src="__STATIC__/admin/js/app.data.js"></script>

  <!-- Sparkline Chart -->
  <script src="__STATIC__/admin/js/charts/sparkline/jquery.sparkline.min.js"></script>  
  <!-- Easy Pie Chart -->
  <script src="__STATIC__/admin/js/charts/easypiechart/jquery.easy-pie-chart.js"></script>
  <script src="__STATIC__/admin/js/ie/excanvas.js"></script>
<body>
  <!-- header -->
  <header id="header" class="navbar bg bg-black" style="transform:translate3d(0, 0px, 0px);-webkit-transform:translate3d(0, 0px, 0px);width: 100%;">
    <!-- <a href="docs.html" class="btn btn-link pull-right"><i class="icon-question icon-xlarge text-default"></i></a> -->
    <a class="navbar-brand" href="#" style="float: none;">运营后台</a>
  </header>
  <!-- / header -->
  <section id="content">
    <div class="main padder">
      <div class="row">
        <div class="col-lg-4 col-offset-4 m-t-large" style="width:400px;">
          <section class="panel" style="clear: both;overflow: hidden;display: block;">
            <header class="panel-heading text-center">
              登陆
            </header>
            <!-- <form action="index.html" class="padder"> -->
              <div class="block">
                <label class="control-label">用户名：</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" class="form-control">
              </div>
              <div class="block">
                <label class="control-label">密码：</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" class="form-control">
              </div>
              <button type="button" class="btn btn-info" onclick="signup()" style="width: 100%;margin-bottom: 10px;">登陆</button>
              <p class="text-muted text-right"><small>还没有账号？</small></p>
              <a href="{:url('Signup/index')}" class="btn btn-white btn-block" style="width: 30%;float: right;">申请代理</a>
            <!-- </form> -->
          </section>
        </div>
      </div>
    </div>
  </section>
  <div id="modal" class="modal fade">
    <form class="m-b-none">
      <div class="modal-dialog pos-abt" style="margin-top:-235px; top:50%">
        <div class="modal-content">
          <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal" aria-hidden="true"><i class="icon-remove"></i></button>
            <h4 class="modal-title" id="myModalLabel">提示</h4>
          </div>
          <div class="modal-body">          
            <div class="block" id="applyResult" style="text-align: center;">
              申请成功
            </div>
          </div>
          <div class="modal-footer" style="text-align: center" id="sureApply"> 
            <button type="button" class="btn btn-small btn-primary" data-dismiss="modal" aria-hidden="true" >确定</button>
          </div>
        </div><!-- /.modal-content -->
      </div>
    </form>
  </div>
  <script type="text/javascript">
    var signup=function(){
      var username=$('#username').val();
      var password=$('#password').val();
      if(username==''){
        $('#modal').modal('show');
        $("#applyResult").html("用户名不能为空");
        return;
      }else if(password==''){
        $('#modal').modal('show');
        $("#applyResult").html("密码不能为空");
        return;
      }else{
        $.post("{:url('Login/login')}",{username:username,password:password},function(res){
            // var res=eval('('+res+')');
            $('#modal').modal('show');
            if(res.state!=1){
              $("#sureApply").html('<button type="button" class="btn btn-small btn-primary" data-dismiss="modal" aria-hidden="true" >确定</button>');
            }else{
              $("#sureApply").html('<button type="button" class="btn btn-small btn-primary" data-dismiss="modal" aria-hidden="true" onclick="goToIndex()" >确定</button>');
            }
            $("#applyResult").html(res.desc);
        },'json');
      }
    }
    function goToIndex(){
      window.location.href="http://"+window.location.host+"/chargeadmin.php/index";
    }
  </script>
{include file="public/bottom"}
