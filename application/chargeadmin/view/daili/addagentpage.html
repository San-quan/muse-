{include file="public/top"}
  <section id="content">
    <div class="main padder">
      <div class="row">
        <div class="col-lg-4 col-offset-4 m-t-large">
          <section class="panel">
            <header class="panel-heading">
              代理管理 / 添加代理
            </header>
            <!-- <form action="{:url('login/login')}" class="padder" > -->
              <div class="block">
                <label class="control-label">用户名:</label>
                <input type="text" placeholder="请输入用户名" id="username" name="username" class="form-control">
              </div>
              <div class="block">
                <label class="control-label">真实姓名:</label>
                <input type="text" placeholder="请输入姓名" id="realname" name="realname" class="form-control">
              </div>
              <div class="block">
                <label class="control-label">密码:</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" class="form-control">
              </div>
              <div class="block">
                <label class="control-label">确认密码:</label>
                <input type="password" id="repeatPassword" name="repeatPassword" placeholder="请确认密码" class="form-control">
              </div>
              <div class="block">
                <label class="control-label">手机号:</label>
                <input type="text" id="phone" name="phone" placeholder="请输入手机号" class="form-control">
              </div>
              <div class="block">
                <label class="control-label">玩家ID:</label>
                <input type="text" id="uid" name="uid" placeholder="请输入玩家ID" class="form-control">
              </div>
              <div class="block">
                <label class="control-label">微信号:</label>
                <input type="text" id="wxid" name="wxid" placeholder="请输入微信号" class="form-control">
              </div>
              <div class="block">
                <label class="control-label">代理级别:</label>
                <select class="input-small inline form-control" id="level" name="level" onchange="levelchange()">
                  {if in_array($memberinfo.level,array(0))}<option value="1">一级</option>{/if}
                  {if in_array($memberinfo.level,array(0,1))}<option value="2">二级</option>{/if}
                  {if in_array($memberinfo.level,array(0,1,2))}<option value="3">三级</option>{/if}
                </select>
              </div>
              <div class="block">
                <label class="control-label">分成比例:</label>
                <input type="text" id="percent" name="percent" placeholder="请输入1-100提现比例" class="form-control" >
              </div>
              <button type="button" class="btn btn-info" onclick="signup()">添加</button>
              <div class="line line-dashed"></div>
              
          
          </section>
        </div>
      </div>
    </div>
  </section>
  <!-- .modal -->
  <div id="modal" class="modal fade">
    <form class="m-b-none">
      <div class="modal-dialog pos-abt" style="margin-top:-235px; top:50%">
        <div class="modal-content">
          <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal" aria-hidden="true"><i class="icon-remove"></i></button>
            <h4 class="modal-title" id="myModalLabel">提示</h4>
          </div>
          <div class="modal-body">          
            <div class="block" id="applyResult" style="text-align: center;">
              
            </div>
          
         
          </div>
          <div class="modal-footer" style="text-align: center" id="sureApply"> 
            <button type="button" class="btn btn-small btn-primary" data-dismiss="modal" aria-hidden="true" >确定</button>
          </div>
        </div><!-- /.modal-content -->
      </div>
    </form>
  </div>
  <!-- / .modal -->
  <script>
    var signup=function(){
      var username=$('#username').val();
      var password=$('#password').val();
      var repeatPassword=$('#repeatPassword').val();
      var phone=$("#phone").val();
      var realname=$("#realname").val();
      var uid=$("#uid").val();
      var wxid=$("#wxid").val();
      var level=$("#level").val();
      var percent=$("#percent").val();
      $('#modal').modal('show');
      if(username==''){
        $('#modal').modal('show');
        $("#applyResult").html("用户名不能为空");
        return; 
      }else if(password==''){
        $('#modal').modal('show');
        $("#applyResult").html("密码不能为空");
        return; 
      }else if(repeatPassword==''){
        $('#modal').modal('show');
        $("#applyResult").html("确认密码不能为空");
        return; 
      }else if(phone==''){
        $('#modal').modal('show');
        $("#applyResult").html("手机号不能为空");
        return; 
      }else if(password.length<6){
        $('#modal').modal('show');
        $("#applyResult").html("密码不能小于6位");
        return; 
      }else if(CheckChinese(username)){
        $('#modal').modal('show');
        $("#applyResult").html("用户名不能含有汉字");
        return;
      }else if(password!=repeatPassword){
        $('#modal').modal('show');
        $("#applyResult").html("两次输入密码不一致");
        return;
      }else if(phone.length!=11){
        $('#modal').modal('show');
        $("#applyResult").html("请输入正确的手机号");
        return;
      }else if(realname==''){
        $('#modal').modal('show');
        $("#applyResult").html("真实姓名不能为空");
        return;
      }else if(uid!=''&&isNaN(uid)){
        $('#modal').modal('show');
        $("#applyResult").html("请输入正确的玩家ID");
        return;
      }else{
        $.post("{:url('Daili/addAgent')}",{username:username,password:password,repeatPassword:repeatPassword,phone:phone,realname:realname,uid:uid,wxid:wxid,level:level,percent:percent},function(res){
            $('#modal').modal('show');
            if(res.state==1){
              $("#sureApply").html('<button onclick="dumptolist()" type="button" class="btn btn-small btn-primary" data-dismiss="modal" aria-hidden="true" >确定</button>');
              $("#applyResult").html(res.desc);
            }else{
              $("#sureApply").html('<button type="button" class="btn btn-small btn-primary" data-dismiss="modal" aria-hidden="true" >确定</button>');
              $("#applyResult").html(res.desc);
            }
            
        },'json');
      }
      
    
    } 
    
    function CheckChinese(val){     
　　var reg = new RegExp("[\\u4E00-\\u9FFF]+","g");
  　　if(reg.test(val)){     
         // alert("不能输入汉字！");  
         return true;      
  　　}else{
        return false;
      }
    }

    $(function(){
      levelchange();
    })
    //改变级别下拉框，提现比例发生改变
    function levelchange(){
      var level=$('#level').val();
      var percent=60;
      switch(level){
        case '1':percent=60;break;
        case '2':percent=50;break;
        case '3':percent=40;break;
      }
      $("#percent").val(percent);
    }

    //添加成功后点击跳转
    function dumptolist(){
      window.location.href="{:url('myAgentList')}";
    }
  </script>
{include file="public/bottom"}
