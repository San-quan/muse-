{include file="public/top"}
  <section id="content">
    <div class="main padder">
      <div class="row">
        <div class="col-lg-4 col-offset-4 m-t-large">
          <section class="panel">
            <header class="panel-heading">
              我的账户 / 修改个人信息
            </header>
            <div class="block">
                <label class="control-label">用户名:</label>
                <input type="text" placeholder="请输入用户名" id="username" disabled value="{$memberinfo['username']}" name="username" class="form-control">
              </div>
              <div class="block">
                <label class="control-label">真实姓名:</label>
                <input type="text" placeholder="请输入姓名" id="realname" value="{$memberinfo['name']}" name="realname" class="form-control">
              </div>
              <div class="block">
                <label class="control-label">密码:</label>
                <input type="password" id="password" name="password" placeholder="如需修改，请输入新密码" class="form-control">
              </div>
         
              <div class="block">
                <label class="control-label">手机号:</label>
                <input type="text" id="phone" name="phone" value="{$memberinfo['phone']}" placeholder="请输入手机号" class="form-control">
              </div>
              <div class="block">
                <label class="control-label">玩家ID:</label>
                <input type="text" id="uid" name="uid" value="{$memberinfo['uid']}" placeholder="请输入玩家ID" class="form-control">
              </div>
              <div class="block">
                <label class="control-label">微信号:</label>
                <input type="text" id="wxid" name="wxid" value="{$memberinfo['wxid']}" placeholder="请输入微信号" class="form-control">
              </div>
              <div class="block">
                <label class="control-label">邀请码:</label>
                <input type="text"  value="{$memberinfo['invite']}" placeholder="请输入邀请码" disabled class="form-control">
              </div><input type="hidden" id="agentID" value="{$memberinfo['id']}">
               
              <button type="button" class="btn btn-info" onclick="doEdit()">确认修改</button>
              <!-- <div class="line line-dashed"></div> -->

                <div class="col-sm-6 text-center">

                </div>
                <div class="col-sm-6 text-center">
                  <a href="#" class="btn btn-twitter btn-circle btn-small"><i class="icon-twitter"></i>Sign up with Twitter</a>
                </div>
              </div> -->
            
            <!-- </form> -->
          </section>
        </div>
      </div>
    </div>
  </section>
  <div id="modal" class="modal fade">
    <form class="m-b-none">
      <div class="modal-dialog pos-abt" style="margin-top:50px;">
        <div class="modal-content">
          <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal" aria-hidden="true"><i class="icon-remove"></i></button>
            <h4 class="modal-title" id="myModalLabel">代理信息</h4>
          </div>
          <div class="modal-body" id="modelContent">          
            
          </div>
          <div class="modal-footer">
            <!-- <button type="button" class="btn btn-small btn-default" id="editBtn" onclick="doEdit()">修改</button> -->
            <button type="button" class="btn btn-small btn-default" data-dismiss="modal" aria-hidden="true">关闭</button>
            <!-- <button type="button" class="btn btn-small btn-primary" data-loading-text="Publishing...">Publish</button> -->
          </div>
        </div><!-- /.modal-content -->
      </div>
    </form>
  </div>
  <script>
    var doEdit=function(){
      
      var password=$('#password').val();
      var repeatPassword=$('#repeatPassword').val();
      var phone=$("#phone").val();
      
      var realname=$("#realname").val();
     
      var aid=$("#agentID").val();
      var uid=$("#uid").val();
      var wxid=$("#wxid").val();
    
      
      
      if(phone==''){
        $('#modal').modal('show');
        $("#modelContent").html("手机号不能为空");
        return; 
      }else if(password.length!=''&&password.length<6){
        $('#modal').modal('show');
        $("#modelContent").html("密码不能小于6位");
        return; 
      }else if(phone.length!=11){
        $('#modal').modal('show');
        $("#modelContent").html("请输入正确的手机号");
        return;
      }else if(realname==''){
        $('#modal').modal('show');
        $("#modelContent").html("真实姓名不能为空");
        return;
      }else if(uid==''||isNaN(uid)){
      $('#modal').modal('show');
      $("#modelContent").html("请输入正确的玩家ID");
      return;
      }else{
        // console.log(112);
        $.post("{:url('Daili/editAgent')}",{uid:uid,password:password,repeatPassword:repeatPassword,phone:phone,realname:realname,aid:aid,uid:uid,wxid:wxid},function(res){
            // var res=eval('('+rel+')');
            console.log(555);
            $('#modal').modal('show');
            // if(res.state!=1){
            //   $("#sureApply").html('<button type="button" class="btn btn-small btn-primary" data-dismiss="modal" aria-hidden="true" >确定</button>');
            // }else{
            //   $("#sureApply").html('<button type="button" class="btn btn-small btn-primary" data-dismiss="modal" aria-hidden="true" onclick="goToIndex()" >确定</button>');
            // }
            // $("#editBtn").hide();
            $("#modelContent").html(res.desc);
        },'json');
      }
  }
  function CheckChinese(val){     
　　var reg = new RegExp("[\\u4E00-\\u9FFF]+","g");

         // alert("不能输入汉字！");  
         return true;      
  　　}else{
        return false;
      }
    }
  </script>
