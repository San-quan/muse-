{include file="public/top"}

  <section id="content">
  <style>
    .mycircle{
        line-height:29px ;font-size: 18px;
    }
    .panel .table td, .panel .table th {
    padding: 0;
    border-top: 1px solid #eaedef;
    text-align: center;
    line-height: 32px;
    font-size: 11px;

}
.pagination > li > a, .pagination > li > span {

    padding: 4px 11px;

}
</style>
    <section class="main padder">
  
      <div class="row">
        <div class="col-lg-12">
          <section class="panel">
            <header class="panel-heading">
              商品管理 / 商品列表
            </header>
            <div class="row text-small">
              <div class="col-lg-12 m-b-mini">
                <!-- <button class="btn btn-small btn-white" type="button" onclick="addGood()">添加商品</button> -->
              </div>
            </div>
            <div class="pull-out m-t-small">
              <table class="table table-striped b-t text-small">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>名称</th>
                    <th>数量</th>
                    <th>价格</th>
                    <th>赠送</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody>
                {if condition="count($ret) gt 0"}
                {volist name='ret' id='list'}
                  <tr>
                    <td>{$list.id}</td>
                    <td>{$list.name}</td>
                    <td>{$list.diamond}</td>
                    <td >{$list.price}</td>
                    <td>{$list.award}</td>
                    <td>
                      <span class="file-input-wrapper btn btn btn-small btn-info" style="font-size: 8px;padding: 3px 5px;" onclick="editGoods({$list.id})">编辑</span>
                      <span class="file-input-wrapper btn btn btn-small btn-danger" style="font-size: 8px;padding: 3px 5px;" onclick="delGoods({$list.id})">删除</span>
                    </td>
                  </tr>
                {/volist}
                {else}
                <tr><td colspan="7">暂无数据...</td></tr>
                {/if}
                </tbody>
              </table>
            </div>
            <footer class="panel-footer">
              <div class="row">
                <div class="col-lg-4 text-right text-center-sm"> 
               
                </div>
              </div>
            </footer>
          </section>
        </div>
      </div>
    </section>
  </section>
  <!-- .modal -->
  <div id="modal" class="modal fade">
    <form class="m-b-none">
      <div class="modal-dialog pos-abt" style="margin-top:50px;">
        <div class="modal-content">
          <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal" aria-hidden="true"><i class="icon-remove"></i></button>
            <h4 class="modal-title" id="modalTitle">商品详情</h4>
          </div>
          <div class="modal-body" id="modelContent">          
            
          </div>
          <div class="modal-footer" id="modalFooter">
            <button type="button" class="btn btn-small btn-default" onclick="doEdit()">修改</button>
            <button type="button" class="btn btn-small btn-default" data-dismiss="modal" aria-hidden="true">关闭</button>
          </div>
        </div><!-- /.modal-content -->
      </div>
    </form>
  </div>
  <div id="tipModal" class="modal fade">
    <div class="modal-dialog pos-abt" style="margin-top:50px;">
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="close" data-dismiss="modal" aria-hidden="true"><i class="icon-remove"></i></button>
          <h4 class="modal-title" id="tipModalTitle">提示</h4>
        </div>
        <div class="modal-body" id="tipModelContent">          
          
        </div>
        <div class="modal-footer" id="tipModalFooter">
          <button type="button" class="btn btn-small btn-default" data-dismiss="modal" aria-hidden="true">确定</button>
        </div>
      </div><!-- /.modal-content -->
    </div>
  </div>
<script src="__STATIC__/laydate/laydate.js"></script> <!-- 改成你的路径 -->
<script>
var editGoods=function(gid){
  $.ajax({
    type:"post",
    dataType:"json",
    url:"{:url('goodinfo')}",
    async:false,
    data:{
      gid:gid,
    },
    success:function(data){
      $("#modalTitle").html('商品详情');
      $("#modelContent").html(data);
      $("#modalFooter").html('<button type="button" class="btn btn-small btn-default" onclick="doEdit('+gid+')">修改</button>'+
            '<button type="button" class="btn btn-small btn-default" data-dismiss="modal" aria-hidden="true">关闭</button>');
      $("#modal").modal('show');
    }
  })
}
var doEdit=function(gid){
  var goodtype=$("#goodtype").val();
  var price=$("#price").val();
  var diamond=$('#diamond').val();
  var award=$('#award').val();
  var name=$("#name").val();
  $.ajax({
    type:"post",
    dataType:"json",
    url:"{:url('editGoods')}",
    async:false,
    data:{
      gid:gid,
      goodtype:goodtype,
      price:price,
      diamond:diamond,
      award:award,
      name:name
    },
    success:function(data){
      $("#tipModalTitle").html('提示');
      $("#tipModelContent").html(data.desc);
      if(data.state){
        $("#tipModalFooter").html('<button type="button" class="btn btn-small btn-default" onclick="reload()">确定</button>');
      }else{
        $("#tipModalFooter").html('<button type="button" class="btn btn-small btn-default" data-dismiss="modal" aria-hidden="true">确定</button>')
      }
      $("#tipModal").modal("show");
    }
  })
}

var addGood=function(){
  $.ajax({
    type:"post",
    dataType:"json",
    url:"{:url('goodinfo')}",
    async:false,
    success:function(data){
      $("#modalTitle").html('添加商品');
      $("#modelContent").html(data);
      $("#modalFooter").html('<button type="button" class="btn btn-small btn-default" onclick="doAdd()">添加</button>'+
            '<button type="button" class="btn btn-small btn-default" data-dismiss="modal" aria-hidden="true">关闭</button>');
      $("#modal").modal('show');
    }
  })
}

var doAdd=function(){
  var goodtype=$("#goodtype").val();
  var price=$("#price").val();
  var diamond=$('#diamond').val();
  var award=$('#award').val();
  var name=$("#name").val();
  $.ajax({
    type:"post",
    dataType:"json",
    url:"{:url('editGoods')}",
    async:false,
    data:{
      goodtype:goodtype,
      price:price,
      diamond:diamond,
      award:award,
      name:name
    },
    success:function(data){
      $("#tipModalTitle").html('提示');
      $("#tipModelContent").html(data.desc);
      if(data.state){
        $("#tipModalFooter").html('<button type="button" class="btn btn-small btn-default" onclick="reload()">确定</button>');
      }else{
        $("#tipModalFooter").html('<button type="button" class="btn btn-small btn-default" data-dismiss="modal" aria-hidden="true">确定</button>')
      }
      $("#tipModal").modal("show");
    }
  })
}

var delGoods=function(id){
  $.ajax({
    type:"post",
    dataType:"json",
    url:"{:url('delGoods')}",
    async:false,
    data:{id:id},
    success:function(data){
      $("#tipModalTitle").html('提示');
      $("#tipModelContent").html('删除成功');
      $("#tipModalFooter").html('<button type="button" class="btn btn-small btn-default" onclick="reload()">确定</button>');
      $("#tipModal").modal('show');
    }
  })
}

var reload=function(){
  window.location.reload();
}
</script>
{include file="public/bottom"}
