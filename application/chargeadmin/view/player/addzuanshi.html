<script src="__STATIC__/laydate/laydate.js"></script> <!-- 改成你的路径 -->
<script>


//执行一个laydate实例
laydate.render({
  elem: '#startDate', //指定元素
  type: 'datetime'
});
laydate.render({
  elem: '#endDate', //指定元素
  type: 'datetime'
});
var roomDetail=function(pwd){
  $.post("getRoomDetail",{pwd:pwd},function(res){
    if(res.state==0){
      $('#modal').modal('show');
      $('#modelContent').html("<p style='color:red;'>暂无数据！</p>");
    }else if(res.state==1){
      $('#modelContent').html(res.html);
      $('#modal').modal('show');
    }
  },'JSON')
}
var turnToBlack=function(isblack,uid,obj){
 var _this=$(obj);
  if(isblack==0?confirm('是否拉黑该玩家？'):confirm('是否恢复该玩家？')){

    $.post("turnToBlack",{isblack:isblack,uid:uid},function(ret){
      // _this=$(_this);
      if(ret==1){
        _this.attr("onclick","turnToBlack(1,"+uid+",this)");
        _this.parent().prev().html('拉黑');
        _this.parent().prev().attr('style',"color:black;");
        _this.html('恢复');
        $('#modelContent').html('拉黑成功');
        $('#modal').modal('show');
      }else{
        _this.attr("onclick","turnToBlack(0,"+uid+",this)");
        _this.parent().prev().html('正常');
        _this.html('拉黑');
        _this.parent().prev().attr('style',"color:green;");
        $('#modelContent').html('恢复成功');
        $('#modal').modal('show');
      }
    },"json")
  }
}
var addzuanshi=function(){
  var modal_title='钻石充值';
  var modal_body='<div class="input-group">'+
                    '<span class="input-group-addon">'+
                    '充值钻石数量'+
                    '</span>'+
                    '<input type="number" id="zuanshi" class="form-control" value="0">'+
                '</div>';
  var modal_footer='<button type="button" class="btn btn-small btn-default" onclick="addzuanshisubmit()">确定充值</button>'+
            '<button type="button" class="btn btn-small btn-default" data-dismiss="modal" aria-hidden="true">关闭</button>';
  $("#modal-title").html(modal_title);
  $("#modal-body").html(modal_body);
  $("#modal-footer").html(modal_footer);
  $("#modal").modal("show");
}
function addzuanshisubmit(){
  var zuanshi=$("#zuanshi").val();
  zuanshi=parseInt(zuanshi);
  if(zuanshi<=0||isNaN(zuanshi)){
    var modal_title='提示';
    var modal_body='充值钻石数请输入正整数';
    var modal_footer='<button type="button" class="btn btn-small btn-default" data-dismiss="modal" aria-hidden="true">关闭</button>';
  }else{

    $.ajax({
      type:"post",
      dataType:"json",
      url:"{:url('Player/ajaxAddzuanshi')}",
      data:{
        uid:{:input('uid')},
        zuanshi:zuanshi
      },
      success:function(data){
        var modal_title='提示';
        var modal_body=data.desc;
        var modal_footer='<button type="button" onclick="dumptoself()" class="btn btn-small btn-default" data-dismiss="modal" aria-hidden="true">确定</button>';
        $("#modal-title").html(modal_title);
        $("#modal-body").html(modal_body);
        $("#modal-footer").html(modal_footer);
      }
    })
  }
  $("#modal-title").html(modal_title);
  $("#modal-body").html(modal_body);
  $("#modal-footer").html(modal_footer);
}
function dumptoself(){
  location.reload();
}
</script>
