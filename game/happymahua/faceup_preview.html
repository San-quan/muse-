<!DOCTYPE HTML>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>#faceUpBox 预览 - 2 张明牌</title>
<meta name="viewport" content="width=device-width,initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
<style>
    html, body { background: #0e2a16; color:#fff; margin:0; padding:0; height:100%; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    #desk{position:fixed;inset:0;background:radial-gradient(ellipse at center, #1f5a32 0%, #0e2a16 60%, #061409 100%);}
    #desk:before{content:"";position:absolute;left:12%;right:12%;top:22%;bottom:22%;border:6px solid rgba(255,220,130,0.25);border-radius:36px;box-shadow:0 0 80px rgba(0,0,0,0.6) inset, 0 0 40px rgba(0,0,0,0.6);}
    #seat1{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);}
    #seat2{position:absolute;left:10%;top:50%;transform:translateY(-50%);}
    #seat3{position:absolute;right:10%;top:50%;transform:translateY(-50%);}
    .seatcard{display:flex;gap:4px;}
    .seatcard .c{width:40px;height:58px;background:#fff8e7;border:1.5px solid #2c1810;border-radius:5px;color:#1565c0;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;}
    #playerInfo{position:fixed;left:16px;top:120px;z-index:2147483644;background:rgba(0,0,0,0.45);color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;line-height:1.9;display:none;}
    #playerInfo b{color:#ffefb0;}
</style>
<style id="faceup-inject-style">
#faceUpBox{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:2147483645;display:none;flex-direction:column;gap:14px;align-items:center;justify-content:center;padding:18px 28px;border-radius:20px;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);border:2px solid rgba(255,220,140,0.25);
  text-align:center; /* IE fallback */
}
#faceUpBox .fu-cards{display:flex;gap:26px;align-items:center;justify-content:center;
  display:inline-block;text-align:center;vertical-align:top; /* IE fallback: inline-block row */
  *display:inline;zoom:1;
}
#faceUpBox .fu-card{position:relative;width:120px;height:160px;border-radius:12px;background:#fff8e7;border:3px solid #2c1810;box-shadow:0 6px 18px rgba(0,0,0,0.5);cursor:pointer;user-select:none;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .12s ease;
  display:-ms-inline-flexbox;display:inline-block;vertical-align:top;text-align:center; /* IE fallback */
  *display:inline;zoom:1;
  margin:0 13px; /* IE fallback half gap on each side = 26 total */
}
#faceUpBox .fu-card.disabled{cursor:not-allowed;opacity:.55;box-shadow:none;}
#faceUpBox .fu-card.clickable:hover{transform:translateY(-6px) scale(1.04);border-color:#e89b33;}
#faceUpBox .fu-card.picked{outline:5px solid #ff7f24;outline-offset:-3px;}
#faceUpBox .fu-suit{font-size:64px;font-weight:900;line-height:1.1;letter-spacing:-1px;
  display:block;margin-top:18px; /* IE fallback: big num top */
}
#faceUpBox .fu-num{margin-top:6px;font-size:30px;font-weight:800;letter-spacing:4px;
  display:block;margin-top:4px; /* IE fallback: below suit */
}
#faceUpBox .fu-label{position:absolute;left:10px;top:8px;font-size:16px;color:#333;font-weight:800;}
#faceUpBox .s-wan .fu-suit{color:#c62828;}
#faceUpBox .s-tiao .fu-suit{color:#2e7d32;}
#faceUpBox .s-tong .fu-suit{color:#1565c0;}
#faceUpBox .s-zi .fu-suit{color:#4a148c;}
#faceUpBox .s-unk .fu-suit{color:#555;}
#faceUpBox .fu-info{color:#fff;font-size:16px;line-height:1.6;width:100%;text-align:center;
  display:block;margin:0 auto 10px auto;
}
#faceUpBox .fu-actions{display:flex;gap:20px;align-items:center;justify-content:center;
  display:inline-block;text-align:center; /* IE fallback */
  *display:inline;zoom:1;
  margin-top:4px;
}
#faceUpBox .fu-btn{padding:14px 34px;border-radius:10px;border:none;font-weight:800;font-size:22px;cursor:pointer;min-width:130px;
  display:inline-block;vertical-align:middle;margin:0 10px; /* IE fallback */
}
#faceUpBox .fu-btn.zimo{background:linear-gradient(180deg,#ff7f24,#e35d0f);color:#fff;box-shadow:0 3px 10px rgba(255,127,36,0.5);
  background:#ff7f24\9; /* IE fallback solid */
}
#faceUpBox .fu-btn.discard{background:linear-gradient(180deg,#f5d26b,#d6a82b);color:#3a2200;box-shadow:0 3px 10px rgba(214,168,43,0.5);
  background:#f5d26b\9; /* IE fallback solid */
}
#faceUpBox .fu-btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4);box-shadow:none;
  filter:alpha(opacity=45)\9;
}
#faceUpBox .fu-stage{color:#ffefb0;font-weight:800;font-size:18px;}
#faceUpBox .fu-timer{color:#ffe28a;font-weight:900;font-size:20px;}
</style>
</head>
<body>
<div id="desk">
    <div id="seat1" class="seatcard">
        <div class="c" style="color:#2e7d32;">一</div><div class="c" style="color:#2e7d32;">二</div><div class="c" style="color:#2e7d32;">三</div>
        <div class="c" style="color:#2e7d32;">五</div><div class="c" style="color:#2e7d32;">六</div><div class="c" style="color:#2e7d32;">七</div>
        <div class="c" style="color:#1565c0;">二</div><div class="c" style="color:#1565c0;">二</div><div class="c" style="color:#1565c0;">六</div>
        <div class="c" style="color:#1565c0;">六</div><div class="c" style="color:#1565c0;">八</div><div class="c" style="color:#1565c0;">九</div><div class="c" style="color:#1565c0;">九</div>
    </div>
    <div id="seat2" class="seatcard" style="flex-direction:column;">
        <div class="c" style="width:30px;height:42px;font-size:14px;">?</div><div class="c" style="width:30px;height:42px;font-size:14px;">?</div><div class="c" style="width:30px;height:42px;font-size:14px;">?</div>
        <div class="c" style="width:30px;height:42px;font-size:14px;">?</div><div class="c" style="width:30px;height:42px;font-size:14px;">?</div><div class="c" style="width:30px;height:42px;font-size:14px;">?</div><div class="c" style="width:30px;height:42px;font-size:14px;">?</div>
    </div>
    <div id="seat3" class="seatcard" style="flex-direction:column;">
        <div class="c" style="width:30px;height:42px;font-size:14px;">?</div><div class="c" style="width:30px;height:42px;font-size:14px;">?</div><div class="c" style="width:30px;height:42px;font-size:14px;">?</div>
        <div class="c" style="width:30px;height:42px;font-size:14px;">?</div><div class="c" style="width:30px;height:42px;font-size:14px;">?</div><div class="c" style="width:30px;height:42px;font-size:14px;">?</div><div class="c" style="width:30px;height:42px;font-size:14px;">?</div>
    </div>
</div>

<div id="playerInfo">
    <b>场景模拟：</b>轮到自己（seat=3，P3）选明牌<br/>
    <b>上下文：</b>AFTER_GANG（杠后翻牌）<br/>
    <b>房间号：</b>TEST3P &nbsp; <b>base_score：</b>1000<br/>
    <b>倒计时：</b><span id="tm">15</span>s<br/>
    <br/>
    <b>点击第 0 张 → 自动发送 PickFlip idx=0</b><br/>
    <b>之后出现按钮：</b>能胡则自摸亮，否则只能打出<br/>
</div>

<div id="faceUpBox" style="display:flex;">
    <div class="fu-info">
        <div>翻屁股明牌 <span class="fu-stage" id="fuStage">已选，请胡/出</span></div>
        <div id="fuSubInfo">上下文: AFTER_GANG · 你是选择者</div>
        <div>剩余 <span class="fu-timer" id="fuTimer">15</span> 秒</div>
    </div>
    <div class="fu-cards">
        <div class="fu-card clickable picked" id="fuCard0" data-idx="0"><div class="fu-label">0</div><div class="fu-suit s-tiao" id="fuSuit0">七</div><div class="fu-num" id="fuNum0">条</div></div>
        <div class="fu-card clickable disabled" id="fuCard1" data-idx="1"><div class="fu-label">1</div><div class="fu-suit s-tong" id="fuSuit1">九</div><div class="fu-num" id="fuNum1">筒</div></div>
    </div>
    <div class="fu-actions" id="fuActions" style="display:flex;">
        <button class="fu-btn zimo" id="fuZimoBtn">自摸</button>
        <button class="fu-btn discard" id="fuDiscardBtn">打出</button>
    </div>
</div>

<script>
(function(){
    var DEBUG = (function(){try{var s=new URLSearchParams(location.search);return s.get('debug')==='1'||s.get('debug')==='true';}catch(e){return false;}})();
    if (DEBUG){ var pi = document.getElementById('playerInfo'); if (pi) pi.style.display = 'block'; }

    var left = 15;
    var tm = document.getElementById('tm');
    var ft = document.getElementById('fuTimer');
    setInterval(function(){ left = left<=0 ? 15 : left-1; if (tm) tm.textContent = String(left); if (ft) ft.textContent = String(left); }, 1000);
    var picked = 0;
    var c0 = document.getElementById('fuCard0');
    var c1 = document.getElementById('fuCard1');
    function setP(i){ picked = i; if (c0) c0.classList.toggle('picked', i===0); if (c1) c1.classList.toggle('picked', i===1); }
    if (c0) c0.addEventListener('click', function(){setP(0);});
    if (c1) c1.addEventListener('click', function(){setP(1);});
    var zb = document.getElementById('fuZimoBtn'); if (zb) zb.addEventListener('click', function(){ alert('发送：{mainid: game_mj_flip_zimo, msg:{roompwd: TEST3P}}');});
    var db = document.getElementById('fuDiscardBtn'); if (db) db.addEventListener('click', function(){ var tile = picked===0 ? 23 : 41; alert('发送：{mainid: game_mj_flip_discard, msg:{roompwd: TEST3P, tile: '+tile+'}}');});
})();
</script>
</body>
</html>
